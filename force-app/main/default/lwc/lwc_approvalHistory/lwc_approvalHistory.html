<template>
    <lightning-card title={cardTitle} icon-name="standard:approval">
        
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            
            <template if:true={showTopActions}>
                <lightning-button 
                    label="Approve" 
                    onclick={handleTopApprove} 
                    class="slds-m-right_xx-small">
                </lightning-button>
                <lightning-button 
                    label="Reject" 
                    onclick={handleTopReject} 
                    class="slds-m-right_x-small">
                </lightning-button>
            </template>

            <lightning-button-icon 
                icon-name="utility:refresh" 
                onclick={handleRefresh} 
                alternative-text="Refresh">
            </lightning-button-icon>
        </div>

        <div class="slds-border_top slds-p-top_none slds-is-relative">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:true={approvalData.length}>
                <lightning-datatable
                    key-field="Id"
                    data={approvalData}
                    columns={columns}
                    onrowaction={handleRowAction}
                    hide-checkbox-column
                    show-row-number-column> </lightning-datatable>
            </template>
            
            <template if:false={approvalData.length}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                    No approval history found.
                </div>
            </template>
        </div>
    </lightning-card>

    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">
                        {modalAction} Approval Request
                    </h2>
                </header>
                
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea 
                        label="Comments" 
                        value={comments} 
                        onchange={handleCommentChange} 
                        max-length="4000" required>
                    </lightning-textarea>
                </div>
                
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={submitAction}>{modalAction}</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
