<template>
    <lightning-quick-action-panel header="Select InCoTerms">

        <div class="main-container">

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="spinner-container">
                    <lightning-spinner
                        alternative-text="Loading InCoTerms..."
                        size="medium">
                    </lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>

                <!-- Error Message -->
                <template if:true={hasError}>
                    <div class="message-box error-box">
                        <lightning-icon
                            icon-name="utility:error"
                            size="small"
                            variant="error"
                            alternative-text="Error">
                        </lightning-icon>

                        <span>{errorMessage}</span>
                    </div>
                </template>

                <!-- Incoterms Available -->
                <template if:true={hasOptions}>

                    <div class="message-box info-box">
                        <lightning-icon
                            icon-name="utility:info"
                            size="small"
                            alternative-text="Information">
                        </lightning-icon>

                        <span>
                            Search and select one InCoTerms value.
                        </span>
                    </div>

                    <div class="field-card">

                        <div class="search-container">

                            <!-- Dropdown Positioning Anchor -->
                            <div
                                class="search-input-anchor"
                                role="combobox"
                                aria-haspopup="listbox"
                                aria-expanded={isDropdownOpen}>

                                <lightning-input
                                    type="search"
                                    name="incotermsSearch"
                                    label="Select InCoTerms"
                                    value={searchKey}
                                    placeholder="Search by InCoTerms Code or Details"
                                    autocomplete="off"
                                    disabled={isSaving}
                                    onchange={handleSearchChange}
                                    onfocus={handleSearchFocus}
                                    onblur={handleSearchBlur}>
                                </lightning-input>

                                <!-- Search Results -->
                                <template if:true={showDropdown}>
                                    <div
                                        class="incoterms-dropdown"
                                        role="listbox"
                                        onmousedown={handleDropdownMouseDown}>

                                        <ul
                                            class="incoterms-list"
                                            role="presentation">

                                            <template
                                                for:each={filteredOptions}
                                                for:item="option">

                                                <li
                                                    key={option.key}
                                                    class="incoterms-list-item"
                                                    role="presentation">

                                                    <button
                                                        type="button"
                                                        class="incoterms-option-button"
                                                        role="option"
                                                        data-key={option.key}
                                                        onclick={handleOptionSelect}>

                                                        <span class="option-content">

                                                            <span class="option-code">
                                                                {option.value}
                                                            </span>

                                                            <template if:true={option.details}>
                                                                <span class="option-details">
                                                                    {option.details}
                                                                </span>
                                                            </template>

                                                        </span>
                                                    </button>
                                                </li>

                                            </template>
                                        </ul>
                                    </div>
                                </template>

                            </div>

                            <p class="search-help-text">
                                Search using the InCoTerms code or any part of
                                its details.
                            </p>

                            <!-- No Search Results -->
                            <template if:true={showNoResults}>
                                <div class="no-results-box">

                                    <lightning-icon
                                        icon-name="utility:search"
                                        size="x-small"
                                        alternative-text="No results">
                                    </lightning-icon>

                                    <span>
                                        No InCoTerms found matching
                                        <strong>“{searchKey}”</strong>.
                                    </span>

                                </div>
                            </template>

                        </div>
                    </div>

                    <!-- Selected Value Preview -->
                    <div class="preview-card">

                        <div class="preview-title">
                            Selected InCoTerms
                        </div>

                        <template if:true={selectedIncoterms}>

                            <div class="preview-row">
                                <span class="preview-label">
                                    InCoTerms Code
                                </span>

                                <span class="preview-value">
                                    {selectedIncoterms}
                                </span>
                            </div>

                            <div class="preview-row">
                                <span class="preview-label">
                                    InCoTerms Details
                                </span>

                                <span class="preview-value">
                                    {selectedIncotermsDetails}
                                </span>
                            </div>

                        </template>

                        <template if:false={selectedIncoterms}>
                            <div class="empty-value">
                                No InCoTerms selected yet
                            </div>
                        </template>

                    </div>

                </template>

                <!-- No Master Records -->
                <template if:false={hasOptions}>
                    <template if:false={hasError}>

                        <div class="message-box warning-box">
                            <lightning-icon
                                icon-name="utility:warning"
                                size="small"
                                alternative-text="Warning">
                            </lightning-icon>

                            <span>
                                No InCoTerms Master records were found.
                            </span>
                        </div>

                    </template>
                </template>

            </template>

        </div>

        <!-- Footer -->
        <div slot="footer">

            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                disabled={isSaving}>
            </lightning-button>

            <lightning-button
                class="slds-m-left_small"
                label="Refresh"
                variant="neutral"
                icon-name="utility:refresh"
                onclick={loadIncoterms}
                disabled={isActionDisabled}>
            </lightning-button>

            <lightning-button
                class="slds-m-left_small"
                label="Save InCoTerms"
                variant="brand"
                icon-name="utility:save"
                onclick={handleSave}
                disabled={isSaveDisabled}>
            </lightning-button>

        </div>

    </lightning-quick-action-panel>
</template>
