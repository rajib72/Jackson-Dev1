<template>
    <lightning-quick-action-panel header="Get Post Office Details">
        <div class="slds-p-around_medium">

            <!-- Address Type Selection -->
            <lightning-combobox
                name="addressType"
                label="Select Address Type"
                value={selectedAddressType}
                placeholder="Select Billing or Shipping"
                options={addressTypeOptions}
                onchange={handleAddressTypeChange}>
            </lightning-combobox>

            <!-- Show only after Billing/Shipping selected -->
            <template if:true={showComponentBody}>

                <div class="slds-m-top_medium">
                    <lightning-input
                        type="text"
                        label="Pincode"
                        value={pincode}
                        disabled>
                    </lightning-input>
                </div>

                <template if:true={message}>
                    <div class="slds-m-top_medium">
                        {message}
                    </div>
                </template>

                <template if:true={showNoPincodeMessage}>
                    <div class="slds-m-top_medium slds-text-color_error">
                        Postal Code is blank on selected address type.
                    </div>
                </template>

                <template if:true={hasRows}>
                    <div class="slds-m-top_medium table-wrap">
                        <lightning-datatable
                            key-field="uniqueKey"
                            data={rows}
                            columns={columns}
                            max-row-selection="1"
                            selected-rows={selectedRowKeys}
                            onrowselection={handleRowSelection}>
                        </lightning-datatable>
                    </div>

                    <div class="slds-m-top_medium">
                        <div class="button-box">
                            <lightning-button
                                label={updateButtonLabel}
                                variant="success"
                                onclick={handleUpdateAddress}
                                disabled={disableUpdate}>
                            </lightning-button>
                        </div>
                    </div>
                </template>

            </template>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
    </lightning-quick-action-panel>
</template>
