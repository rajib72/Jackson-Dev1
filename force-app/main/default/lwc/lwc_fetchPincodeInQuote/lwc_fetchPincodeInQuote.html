<template>
    <lightning-quick-action-panel header="Get Post Office Details">
        <div class="slds-p-around_medium">
            <lightning-input
                type="text"
                label="Pincode"
                value={pincode}
                >
            </lightning-input>

            <template if:true={message}>
                <div class="slds-m-top_medium">
                    {message}
                </div>
            </template>

            <template if:true={showNoPincodeMessage}>
                <div class="slds-m-top_medium slds-text-color_error">
                    Postal Code is blank on this Account.
                </div>
            </template>

            <template if:true={hasRows}>
                <div class="slds-m-top_medium table-wrap">
                    <lightning-datatable
                        key-field="uniqueKey"
                        data={rows}
                        columns={columns}
                        max-row-selection="1"
                        selected-rows={selectedRowKeys}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>
                </div>

                <div class="slds-m-top_medium">
                    <div class="button-box">
                        <lightning-button
                            label="Update Billing Address"
                            variant="success"
                            onclick={handleUpdateBilling}
                            disabled={disableUpdate}>
                        </lightning-button>

                        <lightning-button
                            label="Update Shipping Address"
                            variant="success"
                            onclick={handleUpdateShipping}
                            disabled={disableUpdate}>
                        </lightning-button>
                    </div>
                </div>
            </template>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
    </lightning-quick-action-panel>
</template>
