<template>
    <lightning-quick-action-panel header="Payment Terms Selection">
        <div class="slds-p-around_medium container-box">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <div class="search-wrapper">
                <lightning-input
                    type="search"
                    label="Search Payment Terms"
                    placeholder="Type code or description"
                    value={searchKey}
                    onchange={handleSearchChange}
                    onfocus={handleSearchFocus}>
                </lightning-input>

                <template if:true={showDropdown}>
                    <div class="dropdown-box">
                        <template for:each={filteredOptions} for:item="term">
                            <div
                                key={term.termCode}
                                class={term.cssClass}
                                data-code={term.termCode}
                                data-name={term.termDesc}
                                onclick={handleSelectTerm}>
                                <div class="emp-code">{term.termCode}</div>
                                <div class="emp-name">{term.termDesc}</div>
                            </div>
                        </template>

                        <template if:true={noRecordsFound}>
                            <div class="no-records">No matching payment term found.</div>
                        </template>
                    </div>
                </template>
            </div>

            <template if:true={hasSelectedTerm}>
                <div class="selected-box slds-m-top_medium">
                    <div><strong>Selected Code:</strong> {selectedTermCode}</div>
                    <div><strong>Selected Description:</strong> {selectedTermDesc}</div>

                    <div class="slds-m-top_small">
                        <lightning-button
                            label="Clear Selection"
                            variant="destructive-text"
                            onclick={handleClearSelection}>
                        </lightning-button>
                    </div>
                </div>
            </template>
        </div>

        <div slot="footer">
            <lightning-button
                label="Refresh"
                onclick={handleRefresh}
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button
                variant="brand"
                label="Save"
                onclick={handleSave}
                disabled={isSaveDisabled}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
