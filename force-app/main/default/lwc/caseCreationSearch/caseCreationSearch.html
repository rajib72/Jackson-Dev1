<template>
    <div class="page-container">

        <!-- ====================================================== -->
        <!-- STEP 1: SEARCH                                         -->
        <!-- ====================================================== -->
        <template if:true={isSearchStep}>

            <div class="search-panel">
                <div class="search-grid">

                    <!-- Contact Phone Number -->
                    <div class="input-container">
                        <label class="input-label">
                            Phone / Mobile No
                        </label>

                        <div class="autocomplete-wrapper">
                            <lightning-input type="tel" name="mobileNo" variant="label-hidden" value={mobileNo}
                                placeholder="Type Contact Phone / Mobile No" pattern="[0-9]{10}" minlength="10"
                                maxlength="10" autocomplete="off"
                                message-when-pattern-mismatch="Enter a valid 10-digit Phone / Mobile Number."
                                message-when-too-short="Phone / Mobile Number must contain exactly 10 digits."
                                onchange={handleInputChange} onfocus={handleInputFocus} onblur={handleInputBlur}
                                onkeydown={handleKeyDown} disabled={isMobileSearchDisabled}>
                            </lightning-input>

                            <template if:true={showMobileSuggestionPanel}>
                                <div class="suggestion-panel" role="listbox">

                                    <template if:true={isSuggestionLoading}>
                                        <div class="suggestion-loading">
                                            <lightning-spinner size="small"
                                                alternative-text="Loading Phone suggestions">
                                            </lightning-spinner>
                                        </div>
                                    </template>

                                    <template if:true={suggestionErrorMessage}>
                                        <div class="suggestion-message suggestion-error">
                                            {suggestionErrorMessage}
                                        </div>
                                    </template>

                                    <template if:true={hasSuggestionOptions}>
                                        <ul class="suggestion-list">
                                            <template for:each={suggestionOptions} for:item="suggestion">

                                                <li key={suggestion.recordId}>
                                                    <button type="button" class="suggestion-item" role="option"
                                                        data-record-id={suggestion.recordId}
                                                        data-search-type={suggestion.searchType}
                                                        data-value={suggestion.value} data-label={suggestion.label}
                                                        onmousedown={handleSuggestionMouseDown}
                                                        onclick={handleSuggestionSelect}>

                                                        <lightning-icon icon-name={suggestion.iconName} size="small"
                                                            alternative-text="">
                                                        </lightning-icon>

                                                        <span class="suggestion-text">
                                                            <span class="suggestion-label">
                                                                {suggestion.label}
                                                            </span>

                                                            <span class="suggestion-subtitle">
                                                                {suggestion.subtitle}
                                                            </span>
                                                        </span>
                                                    </button>
                                                </li>
                                            </template>
                                        </ul>
                                    </template>

                                    <template if:true={showSuggestionEmptyState}>
                                        <div class="suggestion-message">
                                            No matching Phone / Mobile Number suggestions found.
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <template if:true={isMobileSuggestionSelected}>
                            <div class="selection-confirmation">
                                <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="Selected">
                                </lightning-icon>
                                Selected
                            </div>
                        </template>
                    </div>

                    <!-- Asset Serial Number -->
                    <div class="input-container">
                        <label class="input-label">
                            Asset Serial No
                        </label>

                        <div class="autocomplete-wrapper">
                            <lightning-input type="text" name="serialNumber" variant="label-hidden" value={serialNumber}
                                placeholder="Type Asset Serial No" maxlength="80" autocomplete="off"
                                onchange={handleInputChange} onfocus={handleInputFocus} onblur={handleInputBlur}
                                onkeydown={handleKeyDown} disabled={isSerialSearchDisabled}>
                            </lightning-input>

                            <template if:true={showSerialSuggestionPanel}>
                                <div class="suggestion-panel" role="listbox">

                                    <template if:true={isSuggestionLoading}>
                                        <div class="suggestion-loading">
                                            <lightning-spinner size="small"
                                                alternative-text="Loading Asset Serial Number suggestions">
                                            </lightning-spinner>
                                        </div>
                                    </template>

                                    <template if:true={suggestionErrorMessage}>
                                        <div class="suggestion-message suggestion-error">
                                            {suggestionErrorMessage}
                                        </div>
                                    </template>

                                    <template if:true={hasSuggestionOptions}>
                                        <ul class="suggestion-list">
                                            <template for:each={suggestionOptions} for:item="suggestion">

                                                <li key={suggestion.recordId}>
                                                    <button type="button" class="suggestion-item" role="option"
                                                        data-record-id={suggestion.recordId}
                                                        data-search-type={suggestion.searchType}
                                                        data-value={suggestion.value} data-label={suggestion.label}
                                                        onmousedown={handleSuggestionMouseDown}
                                                        onclick={handleSuggestionSelect}>

                                                        <lightning-icon icon-name={suggestion.iconName} size="small"
                                                            alternative-text="">
                                                        </lightning-icon>

                                                        <span class="suggestion-text">
                                                            <span class="suggestion-label">
                                                                {suggestion.label}
                                                            </span>

                                                            <span class="suggestion-subtitle">
                                                                {suggestion.subtitle}
                                                            </span>
                                                        </span>
                                                    </button>
                                                </li>
                                            </template>
                                        </ul>
                                    </template>

                                    <template if:true={showSuggestionEmptyState}>
                                        <div class="suggestion-message">
                                            No matching Asset Serial Number suggestions found.
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <template if:true={isSerialSuggestionSelected}>
                            <div class="selection-confirmation">
                                <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="Selected">
                                </lightning-icon>
                                Selected
                            </div>
                        </template>
                    </div>

                    <!-- Customer Name -->
                    <div class="input-container">
                        <label class="input-label">
                            Customer Name
                        </label>

                        <div class="autocomplete-wrapper">
                            <lightning-input type="text" name="customerName" variant="label-hidden" value={customerName}
                                placeholder="Type Customer Name" maxlength="255" autocomplete="off"
                                onchange={handleInputChange} onfocus={handleInputFocus} onblur={handleInputBlur}
                                onkeydown={handleKeyDown} disabled={isCustomerSearchDisabled}>
                            </lightning-input>

                            <template if:true={showCustomerSuggestionPanel}>
                                <div class="suggestion-panel" role="listbox">

                                    <template if:true={isSuggestionLoading}>
                                        <div class="suggestion-loading">
                                            <lightning-spinner size="small"
                                                alternative-text="Loading Customer Name suggestions">
                                            </lightning-spinner>
                                        </div>
                                    </template>

                                    <template if:true={suggestionErrorMessage}>
                                        <div class="suggestion-message suggestion-error">
                                            {suggestionErrorMessage}
                                        </div>
                                    </template>

                                    <template if:true={hasSuggestionOptions}>
                                        <ul class="suggestion-list">
                                            <template for:each={suggestionOptions} for:item="suggestion">

                                                <li key={suggestion.recordId}>
                                                    <button type="button" class="suggestion-item" role="option"
                                                        data-record-id={suggestion.recordId}
                                                        data-search-type={suggestion.searchType}
                                                        data-value={suggestion.value} data-label={suggestion.label}
                                                        onmousedown={handleSuggestionMouseDown}
                                                        onclick={handleSuggestionSelect}>

                                                        <lightning-icon icon-name={suggestion.iconName} size="small"
                                                            alternative-text="">
                                                        </lightning-icon>

                                                        <span class="suggestion-text">
                                                            <span class="suggestion-label">
                                                                {suggestion.label}
                                                            </span>

                                                            <span class="suggestion-subtitle">
                                                                {suggestion.subtitle}
                                                            </span>
                                                        </span>
                                                    </button>
                                                </li>
                                            </template>
                                        </ul>
                                    </template>

                                    <template if:true={showSuggestionEmptyState}>
                                        <div class="suggestion-message">
                                            No existing Customer Name found. Please search using Phone / Mobile Number
                                            instead.
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <template if:true={isCustomerSuggestionSelected}>
                            <div class="selection-confirmation">
                                <lightning-icon icon-name="utility:check" size="xx-small" alternative-text="Selected">
                                </lightning-icon>
                                Selected
                            </div>
                        </template>
                    </div>

                    <!-- Search Buttons -->
                    <div class="button-container">
                        <lightning-button label="Search" title="Search Customer and Asset Details" variant="brand"
                            onclick={handleSearch} disabled={isSearchDisabled}>
                        </lightning-button>

                        <lightning-button label="Clear" title="Clear Search" variant="neutral" onclick={handleReset}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>

                </div>
            </div>

            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="loading-panel">
                    <lightning-spinner alternative-text={loadingAlternativeText} size="medium">
                    </lightning-spinner>

                    <p class="loading-message">
                        {loadingMessage}
                    </p>
                </div>
            </template>

            <!-- Search Error -->
            <template if:true={showSearchError}>
                <div class="no-result-panel">
                    <lightning-icon icon-name="utility:error" size="small" alternative-text="Search Error">
                    </lightning-icon>

                    <span>
                        {errorMessage}
                    </span>
                </div>
            </template>

            <!-- No Results -->
            <template if:true={showNoResults}>
                <div class="no-result-panel no-result-panel_action">
                    <lightning-icon icon-name="utility:search" size="small" alternative-text="No Results">
                    </lightning-icon>

                    <div class="no-result-action-content">
                        <span>
                            {noResultMessage}
                        </span>

                        <template if:true={showCreateNewCustomerCaseButton}>
                            <lightning-button label="Create New Account, Contact & Case"
                                title="Create New Account, Contact and Case" variant="brand" icon-name="utility:add"
                                onclick={handleOpenNewCustomerCase}>
                            </lightning-button>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Search Results -->
            <template if:true={hasResults}>
                <div class="result-panel">

                    <div class="result-header">
                        <div>
                            <span class="result-title">
                                {resultTitle}
                            </span>

                            <span class="selected-result-text">
                                {searchCriteriaText}
                            </span>
                        </div>

                        <span class="result-count">
                            {resultCountText}
                        </span>
                    </div>

                    <!-- Account Details -->
                    <div class="result-header">
                        <div>
                            <span class="result-title">
                                Account Details
                            </span>
                        </div>
                    </div>

                    <template if:true={account}>
                        <div class="selected-item-summary">
                            <lightning-input type="checkbox" label="Select Account" variant="label-hidden"
                                checked={isAccountSelected} onchange={handleAccountSelection} disabled={isLoading}>
                            </lightning-input>

                            <lightning-icon class="summary-icon" icon-name="standard:account" size="small"
                                alternative-text="Account">
                            </lightning-icon>

                            <div class="summary-grid">

                                <div class="summary-item">
                                    <span class="summary-label">
                                        Account Name
                                    </span>

                                    <span class="summary-value">
                                        {account.accountName}
                                    </span>
                                </div>

                                <div class="summary-item">
                                    <span class="summary-label">
                                        Salesforce Account Number
                                    </span>

                                    <span class="summary-value">
                                        {account.salesforceAccountNumber}
                                    </span>
                                </div>

                                <div class="summary-item">
                                    <span class="summary-label">
                                        SAP Account Number
                                    </span>

                                    <span class="summary-value">
                                        {account.sapAccountNumber}
                                    </span>
                                </div>

                                <div class="summary-item">
                                    <span class="summary-label">
                                        Phone
                                    </span>

                                    <span class="summary-value">
                                        {account.phone}
                                    </span>
                                </div>

                                <div class="summary-item">
                                    <span class="summary-label">
                                        Email
                                    </span>

                                    <span class="summary-value">
                                        {account.email}
                                    </span>
                                </div>

                                <div class="summary-item">
                                    <span class="summary-label">
                                        Customer Type
                                    </span>

                                    <span class="summary-value">
                                        {account.customerType}
                                    </span>
                                </div>

                                <div class="summary-item">
                                    <span class="summary-label">
                                        Status
                                    </span>

                                    <span class="summary-value">
                                        {account.status}
                                    </span>
                                </div>

                                <div class="summary-item">
                                    <span class="summary-label">
                                        Active Status
                                    </span>

                                    <span class="summary-value">
                                        {account.activeStatus}
                                    </span>
                                </div>

                                <div class="summary-item">
                                    <span class="summary-label">
                                        Billing Address
                                    </span>

                                    <span class="summary-value">
                                        {account.billingAddress}
                                    </span>
                                </div>

                            </div>
                        </div>
                    </template>

                    <template if:false={account}>
                        <div class="no-result-panel">
                            <lightning-icon icon-name="utility:warning" size="small"
                                alternative-text="Account Not Available">
                            </lightning-icon>

                            <span>
                                The matching record is not linked to an accessible Account.
                            </span>
                        </div>
                    </template>

                    <!-- ================================================== -->
                    <!-- ACCOUNT-BASED RESULT                              -->
                    <!-- Phone Number or Customer Name Search                -->
                    <!-- ================================================== -->
                    <template if:true={isAccountBasedSearchResult}>

                        <template if:true={isMobileSearchResult}>
                            <!-- Matching Contacts -->
                            <div class="result-header">
                                <div>
                                    <span class="result-title">
                                        Matching Contact
                                    </span>
                                </div>

                                <span class="result-count">
                                    {matchedContactCount} Contact(s)
                                </span>
                            </div>

                            <template if:true={hasMatchedContacts}>
                                <div class="contact-card-list">
                                    <template for:each={matchedContacts} for:item="contactRecord">

                                        <div key={contactRecord.contactId} class={contactRecord.cardClass}
                                            data-contact-id={contactRecord.contactId} onclick={handleContactCardClick}>

                                            <lightning-input type="checkbox" label="Select Contact"
                                                variant="label-hidden" data-contact-id={contactRecord.contactId}
                                                checked={contactRecord.isSelected} onclick={handleSelectionControlClick}
                                                onchange={handleContactCardSelection} disabled={isLoading}>
                                            </lightning-input>

                                            <lightning-icon class="summary-icon" icon-name="standard:contact"
                                                size="small" alternative-text="Contact">
                                            </lightning-icon>

                                            <div class="summary-grid">

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Contact Name
                                                    </span>

                                                    <span class="summary-value">
                                                        <a class="contact-record-link" href={contactRecord.contactUrl}
                                                            target="_blank" onclick={handleRecordLinkClick}>
                                                            {contactRecord.contactName}
                                                        </a>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Phone
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-phone value={contactRecord.phone}>
                                                        </lightning-formatted-phone>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Mobile
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-phone value={contactRecord.mobilePhone}>
                                                        </lightning-formatted-phone>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Email
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-email value={contactRecord.email}>
                                                        </lightning-formatted-email>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Title
                                                    </span>

                                                    <span class="summary-value">
                                                        {contactRecord.title}
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Department
                                                    </span>

                                                    <span class="summary-value">
                                                        {contactRecord.department}
                                                    </span>
                                                </div>

                                                <div class="summary-item contact-address-item">
                                                    <span class="summary-label">
                                                        Mailing Address
                                                    </span>

                                                    <span class="summary-value">
                                                        {contactRecord.mailingAddress}
                                                    </span>
                                                </div>

                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template if:false={hasMatchedContacts}>
                                <div class="no-result-panel">
                                    <lightning-icon icon-name="utility:info" size="small"
                                        alternative-text="No Matching Contact">
                                    </lightning-icon>

                                    <span>
                                        No matching Contact record is available.
                                    </span>
                                </div>
                            </template>
                        </template>

                        <template if:true={isCustomerSearchResult}>
                            <!-- Related Contacts -->
                            <div class="result-header">
                                <div>
                                    <span class="result-title">
                                        Related Contacts
                                    </span>
                                </div>

                                <span class="result-count">
                                    {contactCount} Contact(s)
                                </span>
                            </div>

                            <template if:true={hasContacts}>
                                <div class="contact-card-list">
                                    <template for:each={contacts} for:item="contactRecord">

                                        <div key={contactRecord.contactId} class={contactRecord.cardClass}
                                            data-contact-id={contactRecord.contactId} onclick={handleContactCardClick}>

                                            <lightning-input type="checkbox" label="Select Contact"
                                                variant="label-hidden" data-contact-id={contactRecord.contactId}
                                                checked={contactRecord.isSelected} onclick={handleSelectionControlClick}
                                                onchange={handleContactCardSelection} disabled={isLoading}>
                                            </lightning-input>

                                            <lightning-icon class="summary-icon" icon-name="standard:contact"
                                                size="small" alternative-text="Contact">
                                            </lightning-icon>

                                            <div class="summary-grid">

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Contact Name
                                                    </span>

                                                    <span class="summary-value">
                                                        <a class="contact-record-link" href={contactRecord.contactUrl}
                                                            target="_blank" onclick={handleRecordLinkClick}>
                                                            {contactRecord.contactName}
                                                        </a>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Phone
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-phone value={contactRecord.phone}>
                                                        </lightning-formatted-phone>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Mobile
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-phone value={contactRecord.mobilePhone}>
                                                        </lightning-formatted-phone>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Email
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-email value={contactRecord.email}>
                                                        </lightning-formatted-email>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Title
                                                    </span>

                                                    <span class="summary-value">
                                                        {contactRecord.title}
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Department
                                                    </span>

                                                    <span class="summary-value">
                                                        {contactRecord.department}
                                                    </span>
                                                </div>

                                                <div class="summary-item contact-address-item">
                                                    <span class="summary-label">
                                                        Mailing Address
                                                    </span>

                                                    <span class="summary-value">
                                                        {contactRecord.mailingAddress}
                                                    </span>
                                                </div>

                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template if:false={hasContacts}>
                                <div class="no-result-panel">
                                    <lightning-icon icon-name="utility:info" size="small"
                                        alternative-text="No Contacts">
                                    </lightning-icon>

                                    <span>
                                        No Contact records are linked to this Account.
                                    </span>
                                </div>
                            </template>
                        </template>

                        <!-- Combined Asset and Serial Number Cards -->
                        <div class="result-header">
                            <div>
                                <span class="result-title">
                                    Assets and Asset Serial Numbers
                                </span>
                            </div>

                            <span class="result-count">
                                {serialNumberCount} Record(s)
                            </span>
                        </div>

                        <template if:true={hasCombinedAssetSerialCards}>
                            <div class="asset-serial-card-list">
                                <template for:each={combinedAssetSerialCards} for:item="combinedRecord">

                                    <div key={combinedRecord.assetSerialNumberId} class={combinedRecord.cardClass}
                                        data-serial-id={combinedRecord.assetSerialNumberId}
                                        onclick={handleCombinedAssetSerialCardClick}>

                                        <div class="asset-serial-card-selector">
                                            <lightning-input type="checkbox" label="Select Asset Serial Number"
                                                variant="label-hidden"
                                                data-serial-id={combinedRecord.assetSerialNumberId}
                                                checked={combinedRecord.isSelected}
                                                onclick={handleSelectionControlClick}
                                                onchange={handleCombinedAssetSerialSelection} disabled={isLoading}>
                                            </lightning-input>
                                        </div>

                                        <lightning-icon class="asset-serial-card-icon" icon-name="standard:asset_object"
                                            size="small" alternative-text="Asset and Serial Number">
                                        </lightning-icon>

                                        <div class="asset-serial-card-content">

                                            <div class="asset-serial-card-heading">
                                                <div>
                                                    <span class="asset-serial-card-title">
                                                        <a href={combinedRecord.assetUrl} target="_blank"
                                                            onclick={handleRecordLinkClick}>
                                                            {combinedRecord.assetName}
                                                        </a>
                                                    </span>

                                                    <span class="asset-serial-card-subtitle">
                                                        Asset
                                                    </span>
                                                </div>

                                                <div class="asset-serial-number-heading">
                                                    <span class="asset-serial-number-label">
                                                        Asset Serial No
                                                    </span>

                                                    <a class="asset-serial-number-link"
                                                        href={combinedRecord.assetSerialNumberUrl} target="_blank"
                                                        onclick={handleRecordLinkClick}>
                                                        {combinedRecord.serialNumber}
                                                    </a>
                                                </div>
                                            </div>

                                            <div class="asset-serial-detail-grid">

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        PV Module Rating / Model No
                                                    </span>

                                                    <span class="summary-value">
                                                        {combinedRecord.pvModuleRatingModelNo}
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Status
                                                    </span>

                                                    <span class="summary-value">
                                                        {combinedRecord.status}
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Purchase Date
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-date-time
                                                            value={combinedRecord.purchaseDate} year="numeric"
                                                            month="short" day="2-digit" time-zone="UTC">
                                                        </lightning-formatted-date-time>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Install Date
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-date-time
                                                            value={combinedRecord.installDate} year="numeric"
                                                            month="short" day="2-digit" time-zone="UTC">
                                                        </lightning-formatted-date-time>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Invoice Number
                                                    </span>

                                                    <span class="summary-value">
                                                        {combinedRecord.invoiceNumber}
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
                                                        Invoice Date
                                                    </span>

                                                    <span class="summary-value">
                                                        <lightning-formatted-date-time
                                                            value={combinedRecord.invoiceDate} year="numeric"
                                                            month="short" day="2-digit" time-zone="UTC">
                                                        </lightning-formatted-date-time>
                                                    </span>
                                                </div>

                                                <div class="summary-item">
                                                    <span class="summary-label">
