<template>
    <lightning-card>

        <div class="header-section">
            <div class="header-title">
                SAP ORDER REASON SYNC
            </div>

            <div class="header-subtitle">
                Fetch Order Reason records from SAP and create/update them in Salesforce
            </div>
        </div>

        <div class="button-section">

            <lightning-button
                label="Fetch Data"
                variant="brand"
                onclick={handleFetch}
                disabled={isLoading}>
            </lightning-button>

            <lightning-button
                class="refresh-btn"
                label="Refresh"
                onclick={handleRefresh}
                disabled={isLoading}>
            </lightning-button>

        </div>

        <template if:true={isLoading}>
            <div class="spinner-section">
                <lightning-spinner
                    alternative-text="Loading"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <!-- SECOND SCREEN -->

        <template if:true={showResults}>

            <div class="summary-container">

                <div class="summary-message">
                    Processed Successfully.
                    Total Received: {summary.totalReceived},
                    Created: {summary.created},
                    Updated: {summary.updated},
                    Errors: {summary.errors}
                </div>

                <div class="summary-grid">

                    <div class="summary-card total">
                        <div class="card-label">
                            Total Received
                        </div>

                        <div class="card-value">
                            {summary.totalReceived}
                        </div>
                    </div>

                    <div class="summary-card created">
                        <div class="card-label">
                            Created
                        </div>

                        <div class="card-value">
                            {summary.created}
                        </div>
                    </div>

                    <div class="summary-card updated">
                        <div class="card-label">
                            Updated
                        </div>

                        <div class="card-value">
                            {summary.updated}
                        </div>
                    </div>

                    <div class="summary-card errors">
                        <div class="card-label">
                            Errors
                        </div>

                        <div class="card-value">
                            {summary.errors}
                        </div>
                    </div>

                </div>

            </div>

            <div class="table-section">

                <lightning-datatable
                    key-field="key"
                    data={records}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>

            </div>

        </template>

    </lightning-card>
</template>
