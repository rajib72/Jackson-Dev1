<template>
    <lightning-card class="leadCard">
        <!-- Spinner for saving/loading or while checking user permission -->
        <lightning-spinner if:true={showSpinner} alternative-text="Loading" size="medium"></lightning-spinner>

        <!-- Only show content after we finish checking the user's permission -->
        <template if:false={isCheckingPermission}>

            <!-- AUTHORIZED VIEW (User is SRT Sales) -->
            <template if:true={hasPermission}>
                <div class="slds-text-align_center card-title-text">
                    New Lead
                    <template if:true={isStep2}>
                        &nbsp;-&nbsp;{businessSegmentValue}
                    </template>
                </div>

                <div class="required-note slds-p-horizontal_medium">
                    <span class="req-star">*</span>&nbsp;=&nbsp;Required Information
                </div>

                <template if:true={isStep1}>
                    <div class="slds-p-around_medium step1Center">
                        <div class="step1Inner">
                            <lightning-radio-group class="step1Radio" name="businessSegment"
                                label="Select Business Segment" options={businessSegmentRadioOptions}
                                value={businessSegmentValue} type="radio" onchange={handleBusinessSegmentChange}>
                            </lightning-radio-group>

                            <div class="slds-m-top_medium step1Buttons">
                                <lightning-button variant="neutral" label="Cancel" class="slds-m-right_small"
                                    onclick={handleCancel}>
                                </lightning-button>

                                <lightning-button variant="brand" label="Next" onclick={goToStep2}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </template>

                <template if:true={isStep2}>
                    <div class="slds-p-around_medium form-root">

                        <div class="backRow">
                            <lightning-button variant="neutral" label="Back" onclick={resetToStep1}>
                            </lightning-button>
                        </div>

                        <div class="sectionTitle">Basic Lead Information</div>
                        <div class="sectionBody">
                            <lightning-layout multiple-rows class="slds-gutters_small">

                                <lightning-layout-item size="6" padding="around-small">
                                    <div class="ownerInline">
                                        <div class="ownerInlineLabel">Lead Owner</div>
                                        <div class="ownerInlineValue slds-grid slds-grid_vertical-align-center">
                                            <lightning-avatar src={ownerPhoto} alternative-text={ownerName}
                                                fallback-icon-name="standard:user" size="small">
                                            </lightning-avatar>
                                            <div class="ownerName slds-m-left_small">{ownerName}</div>
                                        </div>
                                    </div>

                                    <lightning-input variant="label-inline" label="Company" required
                                        data-field="Company" value={formFields.Company} onchange={handleFieldChange}>
                                    </lightning-input>

                                    <lightning-input variant="label-inline" label="Website" data-field="Website"
                                        value={formFields.Website} onchange={handleFieldChange}>
                                    </lightning-input>

                                    <div class="nameBlock">
                                        <div class="nameLabel">
                                            <span class="req-star">*</span>Name
                                        </div>

                                        <div class="nameFields">
                                            <lightning-combobox label="Salutation" options={salutationOptions}
                                                value={formFields.Salutation} data-field="Salutation"
                                                onchange={handleFieldChange}>
                                            </lightning-combobox>

                                            <lightning-input label="First Name" required data-field="FirstName"
                                                value={formFields.FirstName} onchange={handleFieldChange}>
                                            </lightning-input>

                                            <lightning-input label="Middle Name" data-field="MiddleName"
                                                value={formFields.MiddleName} onchange={handleFieldChange}>
                                            </lightning-input>

                                            <lightning-input label="Last Name" required data-field="LastName"
                                                value={formFields.LastName} onchange={handleFieldChange}>
                                            </lightning-input>
                                        </div>
                                    </div>


                                </lightning-layout-item>

                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input variant="label-inline" label="Lead Status" value={leadStatusValue}
                                        disabled>
                                    </lightning-input>

                                    <lightning-input variant="label-inline" label="Mobile" required
                                        data-field="MobilePhone" value={formFields.MobilePhone}
                                        pattern="^[1-9][0-9]{9}$"
                                        message-when-pattern-mismatch="Please enter exactly 10 digits. Cannot start with 0."
                                        onchange={handleFieldChange}>
                                    </lightning-input>

                                    <lightning-input variant="label-inline" label="Phone" data-field="Phone"
                                        value={formFields.Phone} pattern="^[1-9][0-9]{9}$"
                                        message-when-pattern-mismatch="Please enter exactly 10 digits. Cannot start with 0."
                                        onchange={handleFieldChange}>
                                    </lightning-input>

                                    <lightning-input variant="label-inline" label="Email" type="email" required
                                        data-field="Email" value={formFields.Email} onchange={handleFieldChange}>
                                    </lightning-input>
                                </lightning-layout-item>

                            </lightning-layout>
                        </div>

                        <div class="sectionTitle">Currency</div>
                        <div class="sectionBody">
                            <lightning-combobox variant="label-inline" label="Lead Currency" required
                                options={currencyOptions} value={formFields.CurrencyIsoCode}
                                data-field="CurrencyIsoCode" onchange={handleFieldChange}>
                            </lightning-combobox>
                        </div>

                        <div class="sectionTitle">Additional Information</div>
                        <div class="sectionBody">
                            <lightning-input variant="label-inline" label="Internal Business Team"
                                value={internalBusinessTeamValue} disabled>
                            </lightning-input>

                            <lightning-input variant="label-inline" label="Business Segment"
                                value={businessSegmentValue} disabled>
                            </lightning-input>

                            <lightning-combobox variant="label-inline" label="Business Sub Segment" required
                                options={businessSubSegmentOptions} value={formFields.Business_Sub_Segment__c}
                                data-field="Business_Sub_Segment__c" onchange={handleFieldChange}>
                            </lightning-combobox>

                            <lightning-combobox variant="label-inline" label="Market Segment" required
                                options={marketSegmentOptions} value={formFields.Market_Segment__c}
                                data-field="Market_Segment__c" onchange={handleFieldChange}>
                            </lightning-combobox>

                            <template if:true={showMarketSegmentOthers}>
                                <lightning-input variant="label-inline" label="Market Segment Others" required
                                    data-field="Market_Segment_Others__c" value={formFields.Market_Segment_Others__c}
                                    onchange={handleFieldChange}>
                                </lightning-input>
                            </template>
                        </div>

                        <div class="sectionTitle">Description Information</div>
                        <div class="sectionBody">
                            <lightning-combobox variant="label-inline" label="Lead Source" required
                                options={leadSourceOptions} value={formFields.LeadSource} data-field="LeadSource"
                                onchange={handleFieldChange}>
                            </lightning-combobox>

                            <template if:true={showLeadSourceOthers}>
                                <lightning-input variant="label-inline" label="Lead Source Others" required
                                    data-field="Lead_Source_Others__c" value={formFields.Lead_Source_Others__c}
                                    onchange={handleFieldChange}>
                                </lightning-input>
                            </template>

                            <lightning-combobox variant="label-inline" label="Priority" required options={ratingOptions}
                                value={formFields.Rating} data-field="Rating" onchange={handleFieldChange}>
                            </lightning-combobox>

                            <lightning-textarea variant="label-inline" label="Description" required
                                data-field="Description" value={formFields.Description} onchange={handleFieldChange}>
                            </lightning-textarea>

                            <lightning-input type="date" variant="label-inline" label="Expected Closure Date"
                                data-field="Expected_Closure_Date__c" value={formFields.Expected_Closure_Date__c}
                                onchange={handleFieldChange}
                                message-when-range-underflow="Date must be today or in the future." min={todayDate}>
                            </lightning-input>
                        </div>

                        <template if:true={showEventDetails}>
                            <div class="sectionTitle">Event Details</div>
                            <div class="sectionBody">
                                <lightning-input variant="label-inline" label="Event Name" data-field="Event_Name__c"
                                    value={formFields.Event_Name__c} onchange={handleFieldChange}>
                                </lightning-input>

                                <lightning-input variant="label-inline" type="date" label="Event Date"
                                    data-field="Event_Date__c" value={formFields.Event_Date__c}
                                    onchange={handleFieldChange}>
                                </lightning-input>

                                <lightning-textarea variant="label-inline" label="Event Description"
                                    data-field="Event_Description__c" value={formFields.Event_Description__c}
                                    onchange={handleFieldChange}>
                                </lightning-textarea>
                            </div>
                        </template>

                        <div class="sectionTitle">Product Information</div>
                        <div class="sectionBody">
                            <lightning-input variant="label-inline" label="Expected Capacity"
                                data-field="Expected_Capacity__c" value={formFields.Expected_Capacity__c}
                                onchange={handleFieldChange}>
                            </lightning-input>

                            <lightning-combobox variant="label-inline" label="UOM" options={uomOptions}
                                value={formFields.UOM__c} data-field="UOM__c" onchange={handleFieldChange}>
                            </lightning-combobox>
                        </div>

                        <!-- <div class="sectionTitle">Address Information</div>
                        <div class="sectionBody">
                            <lightning-textarea variant="label-inline" label="Street/Landmark" data-field="Street"
                                value={formFields.Street} onchange={handleFieldChange}>
                            </lightning-textarea>

                            <lightning-input variant="label-inline" label="Postal Code" value={formFields.PostalCode}
                                data-field="PostalCode" pattern="^[1-9][0-9]{5}$"
                                message-when-pattern-mismatch="Please enter exactly 6 digits. Cannot start with 0."
                                onchange={handleFieldChange}>
                            </lightning-input>
                        </div> -->

                        <div class="sectionTitle">Address Information</div>
                        <div class="sectionBody">
                            <lightning-textarea variant="label-inline" label="Street/Landmark" data-field="Street"
                                value={formFields.Street} onchange={handleFieldChange} required> </lightning-textarea>

                            <lightning-input variant="label-inline" label="Postal Code" value={formFields.PostalCode}
                                data-field="PostalCode" pattern="^[1-9][0-9]{5}$"
                                message-when-pattern-mismatch="Please enter exactly 6 digits. Cannot start with 0."
                                onchange={handleFieldChange} required> </lightning-input>
                        </div>

                        <div class="buttonRow">
                            <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isLoading}>
                            </lightning-button>
                            <lightning-button variant="neutral" label="Save & New" onclick={handleSaveAndNew}
                                disabled={isLoading}>
                            </lightning-button>
                            <lightning-button variant="destructive" label="Cancel" onclick={handleCancel}>
                            </lightning-button>
                        </div>

                    </div>
                </template>
            </template>

            <!-- UNAUTHORIZED VIEW (Error Page) -->
            <template if:false={hasPermission}>
                <div class="slds-p-around_xx-large slds-text-align_center">
                    <lightning-icon icon-name="utility:error" alternative-text="Error" variant="error" size="large">
                    </lightning-icon>
                    <h2 class="slds-text-heading_medium slds-m-top_medium" style="color: #c23934; font-weight: bold;">
                        You Don't Have Permission To Perform This Action
                    </h2>
                    <p class="slds-m-top_small slds-text-color_weak">
                        Only members of the SRT Sales team are authorized to create leads here.
                    </p>
                </div>
            </template>

        </template>
    </lightning-card>
</template>
