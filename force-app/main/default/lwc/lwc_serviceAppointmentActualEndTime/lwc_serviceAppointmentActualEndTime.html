<template>
    <lightning-quick-action-panel header="Update Actual End Date/Time">
        <div class="container">
            <div class="info-box">
                <p class="info-text">
                    The current date and time will be saved as Actual End Date/Time.
                </p>
            </div>

            <lightning-input
                type="datetime"
                label="Actual End Date/Time"
                value={currentDateTime}
                disabled
                class="dt-field">
            </lightning-input>
        </div>

        <div slot="footer" class="footer-btns">
            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button
                variant="brand"
                label="Update"
                onclick={handleUpdate}
                disabled={isSaving}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
