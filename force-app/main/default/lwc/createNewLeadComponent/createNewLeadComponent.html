<template>
    <lightning-card class="leadCard">

        <template if:true={isLoadingAuth}>
            <div class="slds-p-around_xlarge slds-is-relative">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoadingAuth}>

            <template if:false={hasPermission}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-icon icon-name="utility:error" alternative-text="Error" variant="error" size="large">
                    </lightning-icon>
                    <h2 class="slds-text-heading_medium slds-m-top_medium slds-text-color_error"
                        style="font-weight: 600;">
                        You Don't Have Permission To Perform This Action
                    </h2>
                    <p class="slds-m-top_small slds-text-color_weak">
                        Only members of the Solar Sales team are authorized to create leads here.
                    </p>
                </div>
            </template>

            <template if:true={hasPermission}>
                <div class="slds-text-align_center card-title-text">New Lead
                    <template if:true={isStep2}>
                        &nbsp;-&nbsp;{businessSegmentDisplayValue}
                    </template>
                </div>

                <div class="required-note slds-p-horizontal_medium">
                    <span class="req-star">*</span>&nbsp;=&nbsp;Required Information
                </div>

                <template if:true={isStep1}>
                    <div class="slds-p-around_medium step1Center">
                        <div class="step1Inner">
                            <lightning-radio-group class="step1Radio" name="businessSegment"
                                label="Select Business Segment" options={businessSegmentRadioOptions}
                                value={businessSegmentValue} type="radio" onchange={handleBusinessSegmentChange}>
                            </lightning-radio-group>

                            <div class="slds-m-top_medium step1Buttons">
                                <lightning-button variant="neutral" label="Cancel" class="slds-m-right_small"
                                    onclick={handleCancel}></lightning-button>

                                <lightning-button variant="brand" label="Next" onclick={goToStep2}
                                    class="slds-m-right_small">
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </template>

                <template if:true={isStep2}>
                    <div class="slds-p-around_medium form-root">

                        <div class="backRow">
                            <lightning-button variant="neutral" label="Back" onclick={resetToStep1}></lightning-button>
                        </div>

                        <template if:true={showKAMOrRetail}>

                            <div class="sectionTitle">Basic Lead Information</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <div class="ownerInline">
                                            <div class="ownerInlineLabel">Lead Owner</div>
                                            <div class="ownerInlineValue slds-grid slds-grid_vertical-align-center">
                                                <div class="slds-m-right_small">
                                                    <lightning-avatar src={ownerPhoto} alternative-text={ownerName}
                                                        fallback-icon-name="standard:user" size="small">
                                                    </lightning-avatar>
                                                </div>
                                                <div class="ownerName">{ownerName}</div>
                                            </div>
                                        </div>

                                        <lightning-input variant="label-inline" label="Company" required
                                            data-field="Company" value={formFields.Company}
                                            onchange={handleFieldChange}>
                                        </lightning-input>

                                        <div class="nameBlock">
                                            <div class="nameLabel"><span class="req-star">*</span>Name</div>
                                            <div class="nameFields">
                                                <div class="name-field salutation">
                                                    <lightning-combobox variant="label-stacked" label="Salutation"
                                                        options={salutationOptions} value={formFields.Salutation}
                                                        data-field="Salutation" onchange={handleFieldChange}>
                                                    </lightning-combobox>
                                                </div>
                                                <div class="name-field first-name">
                                                    <lightning-input variant="label-stacked" type="text"
                                                        label="First Name" required data-field="FirstName"
                                                        value={formFields.FirstName} onchange={handleFieldChange}>
                                                    </lightning-input>
                                                </div>
                                                <div class="name-field middle-name">
                                                    <lightning-input variant="label-stacked" type="text"
                                                        label="Middle Name" data-field="MiddleName"
                                                        value={formFields.MiddleName} onchange={handleFieldChange}>
                                                    </lightning-input>
                                                </div>
                                                <div class="name-field last-name">
                                                    <lightning-input variant="label-stacked" type="text"
                                                        label="Last Name" required data-field="LastName"
                                                        value={formFields.LastName} onchange={handleFieldChange}>
                                                    </lightning-input>
                                                </div>
                                                <div class="name-field suffix">
                                                    <lightning-input variant="label-stacked" type="text" label="Suffix"
                                                        data-field="Suffix" value={formFields.Suffix}
                                                        onchange={handleFieldChange}>
                                                    </lightning-input>
                                                </div>
                                            </div>
                                        </div>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input variant="label-inline" label="Lead Status"
                                            value={leadStatusValue} disabled></lightning-input>
                                        <lightning-input variant="label-inline" label="Mobile" required
                                            data-field="MobilePhone" value={formFields.MobilePhone}
                                            pattern="^[1-9][0-9]{9}$"
                                            message-when-pattern-mismatch="Please enter exactly 10 digits. Cannot start with 0."
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                        <lightning-input variant="label-inline" label="Phone" data-field="Phone"
                                            value={formFields.Phone} pattern="^[1-9][0-9]{9}$"
                                            message-when-pattern-mismatch="Please enter exactly 10 digits. Cannot start with 0."
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                        <lightning-input variant="label-inline" label="Email" type="email" required
                                            data-field="Email" value={formFields.Email} onchange={handleFieldChange}>
                                        </lightning-input>
                                        <lightning-input variant="label-inline" label="Website" data-field="Website"
                                            value={formFields.Website} onchange={handleFieldChange}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div class="sectionTitle">Currency</div>
                            <div class="sectionBody">
                                <template if:true={currencyOptions}>
                                    <lightning-combobox variant="label-inline" label="Lead Currency" required
                                        options={currencyOptions} value={formFields.CurrencyIsoCode}
                                        data-field="CurrencyIsoCode" onchange={handleFieldChange}>
                                    </lightning-combobox>
                                </template>
                            </div>

                            <div class="sectionTitle">Additional Information</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input variant="label-inline" label="Internal Business Team"
                                            value={internalBusinessTeamValue} disabled></lightning-input>
                                        <template if:true={marketSegmentOptions}>
                                            <lightning-combobox variant="label-inline" label="Market Segment" required
                                                options={marketSegmentOptions} value={formFields.Market_Segment__c}
                                                data-field="Market_Segment__c" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                        <template if:true={showMarketSegmentOthers}>
                                            <lightning-input variant="label-inline" type="text"
                                                label="Market Segment Others" required
                                                data-field="Market_Segment_Others__c"
                                                value={formFields.Market_Segment_Others__c}
                                                onchange={handleFieldChange}>
                                            </lightning-input>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input variant="label-inline" label="Business Segment"
                                            value={businessSegmentDisplayValue} disabled></lightning-input>
                                        <template if:true={businessSubSegmentOptions}>
                                            <lightning-combobox variant="label-inline" label="Business Sub Segment"
                                                required options={businessSubSegmentOptions}
                                                value={formFields.Business_Sub_Segment__c}
                                                data-field="Business_Sub_Segment__c" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div class="sectionTitle">Description Information</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <template if:true={leadSourceOptions}>
                                            <lightning-combobox variant="label-inline" label="Lead Source" required
                                                options={leadSourceOptions} value={formFields.LeadSource}
                                                data-field="LeadSource" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                        <template if:true={showLeadSourceOthers}>
                                            <lightning-input variant="label-inline" type="text"
                                                label="Lead Source Others" required data-field="Lead_Source_Others__c"
                                                value={formFields.Lead_Source_Others__c} onchange={handleFieldChange}>
                                            </lightning-input>
                                        </template>
                                        <lightning-input variant="label-inline" type="date"
                                            label="Expected Closure Date" required
                                            value={formFields.Expected_Closure_Date__c} min={todayDateString}
                                            data-field="Expected_Closure_Date__c" onchange={handleFieldChange}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <template if:true={ratingOptions}>
                                            <lightning-combobox variant="label-inline" label="Priority"
                                                options={ratingOptions} required value={formFields.Rating}
                                                data-field="Rating" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                        <lightning-textarea variant="label-inline" label="Description" required
                                            value={formFields.Description} data-field="Description"
                                            onchange={handleFieldChange}>
                                        </lightning-textarea>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div class="sectionTitle">Address Information</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-textarea variant="label-inline" label="Street/Landmark" required
                                            value={formFields.Street} data-field="Street" onchange={handleFieldChange}>
                                        </lightning-textarea>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input variant="label-inline" label="Postal Code" required
                                            value={formFields.PostalCode} data-field="PostalCode"
                                            pattern="^[1-9][0-9]{5}$"
                                            message-when-pattern-mismatch="Please enter exactly 6 digits. Cannot start with 0."
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        </template>

                        <template if:true={showInstitutional}>
                            <div class="sectionTitle">Basic Lead Information</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <div class="ownerInline">
                                            <div class="ownerInlineLabel">Lead Owner</div>
                                            <div class="ownerInlineValue slds-grid slds-grid_vertical-align-center">
                                                <div class="slds-m-right_small">
                                                    <lightning-avatar src={ownerPhoto} alternative-text={ownerName}
                                                        fallback-icon-name="standard:user" size="small">
                                                    </lightning-avatar>
                                                </div>
                                                <div class="ownerName">{ownerName}</div>
                                            </div>
                                        </div>
                                        <lightning-input variant="label-inline" label="Company" required
                                            data-field="Company" value={formFields.Company}
                                            onchange={handleFieldChange}></lightning-input>
                                        <div class="nameBlock">
                                            <div class="nameLabel"><span class="req-star">*</span>Name</div>
                                            <div class="nameFields">
                                                <div class="name-field salutation">
                                                    <lightning-combobox variant="label-stacked" label="Salutation"
                                                        options={salutationOptions} value={formFields.Salutation}
                                                        data-field="Salutation" onchange={handleFieldChange}>
                                                    </lightning-combobox>
                                                </div>
                                                <div class="name-field first-name">
                                                    <lightning-input variant="label-stacked" label="First Name" required
                                                        data-field="FirstName" value={formFields.FirstName}
                                                        onchange={handleFieldChange}>
                                                    </lightning-input>
                                                </div>
                                                <div class="name-field middle-name">
                                                    <lightning-input variant="label-stacked" label="Middle Name"
                                                        data-field="MiddleName" value={formFields.MiddleName}
                                                        onchange={handleFieldChange}>
                                                    </lightning-input>
                                                </div>
                                                <div class="name-field last-name">
                                                    <lightning-input variant="label-stacked" label="Last Name" required
                                                        data-field="LastName" value={formFields.LastName}
                                                        onchange={handleFieldChange}>
                                                    </lightning-input>
                                                </div>
                                                <div class="name-field suffix">
                                                    <lightning-input variant="label-stacked" label="Suffix"
                                                        data-field="Suffix" value={formFields.Suffix}
                                                        onchange={handleFieldChange}>
                                                    </lightning-input>
                                                </div>
                                            </div>
                                        </div>
                                    </lightning-layout-item>

                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input variant="label-inline" label="Lead Status"
                                            value={leadStatusValue} disabled></lightning-input>
                                        <lightning-input variant="label-inline" label="Mobile" required
                                            data-field="MobilePhone" value={formFields.MobilePhone}
                                            pattern="^[1-9][0-9]{9}$"
                                            message-when-pattern-mismatch="Please enter exactly 10 digits. Cannot start with 0."
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                        <lightning-input variant="label-inline" label="Phone" data-field="Phone"
                                            value={formFields.Phone} pattern="^[1-9][0-9]{9}$"
                                            message-when-pattern-mismatch="Please enter exactly 10 digits. Cannot start with 0."
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                        <lightning-input variant="label-inline" label="Website" data-field="Website"
                                            value={formFields.Website} onchange={handleFieldChange}></lightning-input>
                                        <lightning-input variant="label-inline" label="Email" type="email" required
                                            data-field="Email" value={formFields.Email} onchange={handleFieldChange}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div class="sectionTitle">Currency</div>
                            <div class="sectionBody">
                                <template if:true={currencyOptions}>
                                    <lightning-combobox variant="label-inline" label="Lead Currency" required
                                        options={currencyOptions} value={formFields.CurrencyIsoCode}
                                        data-field="CurrencyIsoCode" onchange={handleFieldChange}>
                                    </lightning-combobox>
                                </template>
                            </div>

                            <div class="sectionTitle">Tender Details</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input variant="label-inline" label="Tender ID"
                                            data-field="Tender_ID__c" required value={formFields.Tender_ID__c}
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                        <lightning-input variant="label-inline" label="Tender Name"
                                            data-field="Tender_Name__c" required value={formFields.Tender_Name__c}
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                        <template if:true={tenderTypeOptions}>
                                            <lightning-combobox variant="label-inline" label="Tender Type" required
                                                options={tenderTypeOptions} value={formFields.Tender_Type__c}
                                                data-field="Tender_Type__c" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                        <lightning-textarea variant="label-inline" label="Tender Details" required
                                            data-field="Tender_Details__c" value={formFields.Tender_Details__c}
                                            onchange={handleFieldChange}>
                                        </lightning-textarea>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <template if:true={tenderSourceOptions}>
                                            <lightning-combobox variant="label-inline" label="Tender Source" required
                                                options={tenderSourceOptions} value={formFields.Tender_Source__c}
                                                data-field="Tender_Source__c" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                        <lightning-input variant="label-inline" label="Tender Due Date" type="date"
                                            required data-field="Tender_Due_Date__c"
                                            value={formFields.Tender_Due_Date__c} min={todayDateString}
                                            message-when-range-underflow="Tender Due Date cannot be in the past."
                                            onchange={handleFieldChange}></lightning-input>
                                        <lightning-input variant="label-inline" label="Estimated Tender Value (CR)"
                                            required type="number" formatter="currency" step="0.01"
                                            data-field="Estimated_Tender_Value__c"
                                            value={formFields.Estimated_Tender_Value__c} onchange={handleFieldChange}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div class="sectionTitle">Additional Information</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input variant="label-inline" label="Internal Business Team"
                                            value={internalBusinessTeamValue} disabled></lightning-input>
                                        <template if:true={marketSegmentOptions}>
                                            <lightning-combobox variant="label-inline" label="Market Segment" required
                                                options={marketSegmentOptions} value={formFields.Market_Segment__c}
                                                data-field="Market_Segment__c" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                        <template if:true={showMarketSegmentOthers}>
                                            <lightning-input variant="label-inline" type="text"
                                                label="Market Segment Others" required
                                                data-field="Market_Segment_Others__c"
                                                value={formFields.Market_Segment_Others__c}
                                                onchange={handleFieldChange}>
                                            </lightning-input>
                                        </template>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <template if:true={showInstitutionalBusinessSegmentInUI}>
                                            <lightning-input variant="label-inline" label="Business Segment"
                                                value="Institutional" disabled></lightning-input>
                                        </template>
                                        <template if:true={businessSubSegmentOptions}>
                                            <lightning-combobox variant="label-inline" label="Business Sub Segment"
                                                required options={businessSubSegmentOptions}
                                                value={formFields.Business_Sub_Segment__c}
                                                data-field="Business_Sub_Segment__c" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div class="sectionTitle">Description Information</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <template if:true={leadSourceOptions}>
                                            <lightning-combobox variant="label-inline" label="Lead Source" required
                                                options={leadSourceOptions} value={formFields.LeadSource}
                                                data-field="LeadSource" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                        <template if:true={showLeadSourceOthers}>
                                            <lightning-input variant="label-inline" type="text"
                                                label="Lead Source Others" required data-field="Lead_Source_Others__c"
                                                value={formFields.Lead_Source_Others__c} onchange={handleFieldChange}>
                                            </lightning-input>
                                        </template>
                                        <lightning-input variant="label-inline" type="date"
                                            label="Expected Closure Date" required
                                            value={formFields.Expected_Closure_Date__c}
                                            data-field="Expected_Closure_Date__c" min={formFields.Tender_Due_Date__c}
                                            message-when-range-underflow="Expected Closure Date cannot be prior to the Tender Due Date."
                                            onchange={handleFieldChange} disabled={isExpectedClosureDisabled}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <template if:true={ratingOptions}>
                                            <lightning-combobox variant="label-inline" label="Priority"
                                                options={ratingOptions} required value={formFields.Rating}
                                                data-field="Rating" onchange={handleFieldChange}>
                                            </lightning-combobox>
                                        </template>
                                        <lightning-textarea variant="label-inline" label="Description"
                                            value={formFields.Description} data-field="Description"
                                            onchange={handleFieldChange}></lightning-textarea>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>

                            <div class="sectionTitle">Address Information</div>
                            <div class="sectionBody">
                                <lightning-layout multiple-rows="true" class="slds-gutters_small">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-textarea variant="label-inline" label="Street/Landmark" required
                                            value={formFields.Street} data-field="Street" onchange={handleFieldChange}>
                                        </lightning-textarea>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <lightning-input variant="label-inline" label="Postal Code" required
                                            value={formFields.PostalCode} data-field="PostalCode"
                                            pattern="^[1-9][0-9]{5}$"
                                            message-when-pattern-mismatch="Please enter exactly 6 digits. Cannot start with 0."
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        </template>

                        <div class="buttonRow">
                            <lightning-button variant="brand" label="Save" onclick={handleSave}
                                class="slds-m-right_small"></lightning-button>
                            <lightning-button variant="neutral" label="Save & New" onclick={handleSaveAndNew}
                                class="slds-m-right_small"></lightning-button>
                            <lightning-button variant="destructive" label="Cancel" onclick={handleCancel}>
                            </lightning-button>
                        </div>
                    </div>
                </template>
            </template>
        </template>
    </lightning-card>
</template>
