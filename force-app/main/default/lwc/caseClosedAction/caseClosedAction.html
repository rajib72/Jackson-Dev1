<template>

    <lightning-quick-action-panel header="Close Case">

        <lightning-record-edit-form
            record-id={recordId}
            object-api-name="Case"
            onsubmit={handleSubmit}
            onsuccess={handleSuccess}
            onerror={handleError}>

            <div class="slds-p-around_medium">

                <p class="slds-m-bottom_medium">
                    Please provide the required details
                    before closing the Case.
                </p>

                <lightning-messages></lightning-messages>

                <!-- Existing Case Product -->
                <lightning-input-field
                    field-name="Product__c"
                    disabled>
                </lightning-input-field>

                <!-- Mandatory Closure Remark -->
                <lightning-input-field
                    field-name="Closure_Remark__c"
                    required
                    disabled={isSaving}>
                </lightning-input-field>

            </div>

            <template if:true={isSaving}>
                <lightning-spinner
                    alternative-text="Closing Case..."
                    size="small">
                </lightning-spinner>
            </template>

            <div class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    onclick={handleCancel}
                    disabled={isSaving}
                    class="slds-m-right_small">
                </lightning-button>

                <lightning-button
                    type="submit"
                    variant="brand"
                    label="Close Case"
                    disabled={isSaving}>
                </lightning-button>

            </div>

        </lightning-record-edit-form>

    </lightning-quick-action-panel>

</template>
