<template>
    <lightning-quick-action-panel header="Attach PO Document">
        <div class="main-wrapper">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Processing" size="small"></lightning-spinner>
            </template>

            <div class="info-card">
                <div class="title-row">
                    <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                    <div>
                        <h2>Upload PO Document</h2>
                        <p>Select the PO document, review it, then click Upload to send it to SAP.</p>
                    </div>
                </div>

                <div class="so-box">
                    <span class="label">SO Number sent to SAP</span>
                    <span class="value">{sapDescription}</span>
                </div>
            </div>

            <template if:false={selectedContentDocumentId}>
                <div class="upload-box">
                    <lightning-file-upload
                        label="Select PO Document"
                        name="poUploader"
                        record-id={recordId}
                        accept={acceptedFormats}
                        onuploadfinished={handleUploadFinished}
                        disabled={disableFileSelection}>
                    </lightning-file-upload>

                    <p class="help-text">
                        After selecting the file, you can review the file name before uploading it to SAP.
                    </p>
                </div>
            </template>

            <template if:true={selectedContentDocumentId}>
                <div class="selected-file-card">
                    <div class="file-left">
                        <lightning-icon icon-name="doctype:pdf" size="small"></lightning-icon>
                        <div>
                            <p class="file-label">Selected File</p>
                            <h3>{selectedFileName}</h3>
                        </div>
                    </div>

                    <template if:false={isSapUploaded}>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Remove File"
                            title="Remove File"
                            onclick={handleRemoveFile}
                            disabled={isLoading}>
                        </lightning-button-icon>
                    </template>
                </div>

                <template if:false={isSapUploaded}>
                    <p class="help-text">
                        Click Upload to send this file to SAP, or remove it and select another file.
                    </p>
                </template>
            </template>

            <template if:true={successMessage}>
                <div class="success-box">
                    <lightning-icon icon-name="utility:success" size="x-small"></lightning-icon>
                    <div>
                        <strong>{successMessage}</strong>
                        <template if:true={dmsDocumentNo}>
                            <p>DMS Document No: {dmsDocumentNo}</p>
                        </template>
                    </div>
                </div>
            </template>

            <template if:true={errorMessage}>
                <div class="error-box">
                    <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                    <p>{errorMessage}</p>
                </div>
            </template>

        </div>

        <div slot="footer" class="footer-actions">
            <lightning-button
                label="Close"
                onclick={handleClose}
                disabled={isLoading}>
            </lightning-button>

            <template if:true={showUploadButton}>
                <lightning-button
                    label="Upload"
                    variant="brand"
                    onclick={handleUploadToSap}
                    disabled={disableUploadButton}>
                </lightning-button>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
