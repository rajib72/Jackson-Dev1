<template>
    <lightning-quick-action-panel header="Delivering Plant Selection">
        <div class="slds-p-around_medium container-box">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <div class="search-wrapper">
                <lightning-input
                    type="search"
                    label="Search Delivering Plant"
                    placeholder="Type plant code or description"
                    value={searchKey}
                    onchange={handleSearchChange}
                    onfocus={handleSearchFocus}>
                </lightning-input>

                <template if:true={showDropdown}>
                    <div class="dropdown-box">
                        <template for:each={filteredPlantOptions} for:item="plant">
                            <div
                                key={plant.plantCode}
                                class={plant.cssClass}
                                data-code={plant.plantCode}
                                data-name={plant.plantName}
                                onclick={handleSelectPlant}>
                                <div class="emp-code">{plant.plantCode}</div>
                                <div class="emp-name">{plant.plantName}</div>
                            </div>
                        </template>

                        <template if:true={noRecordsFound}>
                            <div class="no-records">No matching plant found.</div>
                        </template>
                    </div>
                </template>
            </div>

            <template if:true={hasSelectedPlant}>
                <div class="selected-box slds-m-top_medium">
                    <div><strong>Selected Plant Code:</strong> {selectedPlantCode}</div>
                    <div><strong>Selected Plant Description:</strong> {selectedPlantName}</div>

                    <div class="slds-m-top_small">
                        <lightning-button
                            label="Clear Selection"
                            variant="destructive-text"
                            onclick={handleClearSelection}>
                        </lightning-button>
                    </div>
                </div>
            </template>
        </div>

        <div slot="footer">
            <lightning-button
                label="Refresh"
                onclick={handleRefresh}
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                class="slds-m-right_small">
            </lightning-button>

            <lightning-button
                variant="brand"
                label="Save"
                onclick={handleSave}
                disabled={isSaveDisabled}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
