<template>
    <lightning-quick-action-panel header="Get Post Office Details">
        <div class="slds-p-around_medium">
            <lightning-input
                type="text"
                label="Pincode"
                value={pincode}
                readonly>
            </lightning-input>

            <template if:true={message}>
                <div class="slds-m-top_medium">
                    {message}
                </div>
            </template>

            <template if:true={showNoPincodeMessage}>
                <div class="slds-m-top_medium slds-text-color_error">
                    Pin Code is blank on this Asset.
                </div>
            </template>

            <template if:true={hasRows}>
                <div class="slds-m-top_medium table-wrap">
                    <lightning-datatable
                        key-field="uniqueKey"
                        data={rows}
                        columns={columns}
                        max-row-selection="1"
                        selected-rows={selectedRowKeys}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Update Asset"
                        variant="success"
                        onclick={handleUpdate}
                        disabled={disableUpdate}>
                    </lightning-button>
                </div>
            </template>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
    </lightning-quick-action-panel>
</template>
