<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container">
            <template if:true={isLoading}>
                <lightning-spinner alt="Loading" size="medium"></lightning-spinner>
            </template>

            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">New Project</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <lightning-record-edit-form 
                    object-api-name="Project__c" 
                    onsuccess={handleSuccess} 
                    onerror={handleError}>
                    
                    <lightning-messages></lightning-messages>

                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                            <lightning-input-field field-name="Name" required></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-p-around_small">
                            <lightning-input-field field-name="Project_Location__c" required></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <lightning-input-field field-name="Project_Type__c" required></lightning-input-field>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_small">
                            <lightning-input-field field-name="Project_Capacity__c" required></lightning-input-field>
                        </div>
                    </div>
                </lightning-record-edit-form>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                <lightning-button variant="brand" class="slds-m-left_small" label="Save" onclick={handleSave}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
