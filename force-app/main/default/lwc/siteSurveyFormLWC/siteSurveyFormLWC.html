<template>

    <div class="header-container">

        <!--<div class="logo-section">
            <img src={logoUrl} alt="Company Logo"/>
        </div>-->

        <div class="title-section">
            <div class="main-title">Site Survey Report</div>
            <div class="sub-title">(Grid tied Rooftop & Small Ground Mounting Solar PV System)</div>
        </div>

        <div class="doc-section">
            <b>Doc No:</b> {docNumber}
        </div>

    </div>

    <div class="note">
        <b>Note:</b> Please fill the mandatory<span style="color: red;">*</span> fields carefully.
    </div>

    <div class="slds-p-around_medium">

        <lightning-record-edit-form object-api-name="Site_Survey__c" onsuccess={handleSuccess} onsubmit={handleSubmit}>

            <lightning-input-field field-name="Customer_Name__c" value={accountId} class="slds-hide">
            </lightning-input-field>
            <!-- Form Errors -->
            <lightning-messages></lightning-messages>

            <template if:true={isLoading}>
                <div style="margin-top:1rem;">
                    <lightning-spinner alternative-text="Submitting Survey..." size="medium">
                    </lightning-spinner>
                </div>
            </template>

            <!-- Link Site Survey to Opportunity -->
            <lightning-input-field field-name="Opportunity__c" value={recordId} class="slds-hide">
            </lightning-input-field>

            <!-- 1. CUSTOMER DETAILS -->
            <h2 class="section slds-m-top_large" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">
                Customer Details</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover "
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; ">

                <tbody>

                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600;  border: 1px solid #dde5ef;">
                            Customer Name</td>
                        <td style="padding: 0.75rem 1rem; vertical-align: top; border: 1px solid #dde5ef;" colspan="3">
                            {accountName}</td>
                    </tr>

                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600; border: 1px solid #dde5ef;">
                            Address</td>
                        <td style="padding: 0.75rem 1rem; vertical-align: top; border: 1px solid #dde5ef;" colspan="3">
                            <div class="slds-wrap">{address}</div>
                            <lightning-input type="checkbox" label="Location same as Address"
                                onchange={handleAddressCheckbox}>
                            </lightning-input>
                        </td>
                    </tr>

                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600; border: 1px solid #dde5ef;">
                            Location<span style="color: red;">*</span></td>
                        <td style="padding: 0.75rem 1rem; vertical-align: top; border: 1px solid #dde5ef;" colspan="3">
                            <lightning-input-field field-name="Location__c" variant="label-hidden"
                                data-id="locationField" required>
                            </lightning-input-field>
                        </td>
                    </tr>

                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600; border: 1px solid #dde5ef; white-space: normal; word-wrap: break-word;">
                            Nearest Airport / Railway Station</td>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; border: 1px solid #dde5ef; border-right: none;">
                            <lightning-input-field field-name="Nearest_Airport_Railway_station__c"
                                variant="label-hidden"></lightning-input-field>
                        </td>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600;  border: 1px solid #dde5ef; border-left: none; border-right: none;">
                            Contact Person Name</td>
                        <td style="padding: 0.75rem 1rem; border:1px solid #dde5ef;">

                            <div style="width:100%;">
                                <lightning-combobox placeholder="Select Contact" options={contactOptions}
                                    value={selectedContactId} onchange={handleContactChange} variant="label-hidden">
                                </lightning-combobox>
                            </div>

                        </td>
                    </tr>
                </tbody>
            </table>


            <!-- 2. SITE DETAILS -->
            <h2 class="section slds-m-top_large" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Site
                Details</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered"
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; border: 1px solid #dde5ef;">

                <tbody>
                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600;  border: 1px solid #dde5ef; width: 15%;">
                            Longitude<span style="color: red;">*</span></td>
                        <td style="padding: 0.75rem 1rem; vertical-align: top; border: 1px solid #dde5ef; width: 35%;">
                            <lightning-input-field field-name="Longitude_deg__c" variant="label-hidden" required>
                            </lightning-input-field>
                        </td>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600; border: 1px solid #dde5ef; width: 15%;">
                            Latitude<span style="color: red;">*</span></td>
                        <td style="padding: 0.75rem 1rem; vertical-align: top; border: 1px solid #dde5ef; width: 35%;">
                            <lightning-input-field field-name="Latitude_deg__c" variant="label-hidden" required>
                            </lightning-input-field>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 3. PROJECT DETAILS -->
            <h2 class="section slds-m-top_large">Project details</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered"
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; border: 1px solid #dde5ef;">

                <tbody>
                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600;  border: 1px solid #dde5ef; width: 15%;">
                            Project segment<span style="color: red;">*</span></td>
                        <td style="padding: 0.75rem 1rem; vertical-align: top; border: 1px solid #dde5ef; width: 35%;">
                            <lightning-input-field 
            field-name="Project_segment__c" 
            variant="label-hidden" 
            onchange={handleProjectSegmentChange}
            required>
        </lightning-input-field>
                        </td>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600;  border: 1px solid #dde5ef; width: 15%;">
                            Net Metering<span style="color: red;">*</span></td>
                        <td style="padding: 0.75rem 1rem; vertical-align: top; border: 1px solid #dde5ef; width: 35%;">
                            <lightning-input-field field-name="Net_Metering__c" variant="label-hidden"
                                onchange={handleNetMeteringChange} required>
                            </lightning-input-field>
                        </td>
                    </tr>
                    <template if:true={isRooftop}>
                        <tr>
                            <td style="padding: 0.75rem 1rem; font-weight: 600; border: 1px solid #dde5ef;">
                                Rooftop Type<span style="color: red;">*</span>
                            </td>
                            <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                                <lightning-input-field field-name="Rooftop_Type__c" variant="label-hidden" required>
                                </lightning-input-field>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <!-- 4. GRID DETAILS -->
            <h2 class="section slds-m-top_large" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Grid
                details</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered"
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; border: 1px solid #dde5ef;">
                <tbody>

                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; normal; word-wrap: break-word;">
                            Existing Metering / billing
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Existing_Metering_billing__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td
                            style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; normal; word-wrap: break-word;">
                            Mail Breaker Size and Make
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Mail_Breaker_Size_and_Make_In_Amps__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Solar
                            Termination Voltage level
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Solar_Termination_Voltage_level__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>

                    </tr>
                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Existing
                            Electrical load
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Existing_Electrical_load__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">I/P Existing
                            Electricity Load
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="I_P_Ext_Elec_Load__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Power quality of
                            grid
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Power_quality_of_grid__c" variant="label-hidden"
                                onchange={handlePowerQualityChange}>
                            </lightning-input-field>

                        </td>
                        <template if:true={isPoorQuality}>
                            <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Reason for
                                Poor Quality
                            </td>
                            <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">

                                <lightning-input-field field-name="Power_quality_of_grid_If_Poor__c"
                                    variant="label-hidden">
                                </lightning-input-field>
                            </td>
                        </template>
                    </tr>

                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Distance between
                            Grid MFM to ACDB
                            <br>

                            <span class="slds-text-body_small">in case of 0 export provision</span>
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Distance_between_the_Grid_MFM_to_ACDB__c"
                                variant="label-hidden">
                            </lightning-input-field>

                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 5. DG DETAILS -->
            <h2 class="section slds-m-top_large" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">DG
                details</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered"
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; border: 1px solid #dde5ef;">

                <tbody>
                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600; border: 1px solid #dde5ef; white-space: normal; word-wrap: break-word;">
                            DG Synchronization with Solar system<span style="color: red;">*</span>
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="DG_Synchronization_with_Solar_system__c"
                                variant="label-hidden" required>
                            </lightning-input-field>
                        </td>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600; border: 1px solid #dde5ef; white-space: normal; word-wrap: break-word;">
                            Total no of DG Sets
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Total_no_of_Gensets__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>

                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; vertical-align: top; font-weight: 600; border: 1px solid #dde5ef; white-space: normal; word-wrap: break-word;">
                            Capacity of each DG Set
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Capacity_of_each_Gensets__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">DG Make
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="DG_Make__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Genset operation
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Genset_operation__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Distance between
                            the MFM of DG</td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Distance_between_the_MFM_of_DGs__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Last DG MFM to
                            ACDB distance
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Last_DG_MFM_to_ACDB_distance__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">DG output
                            voltage
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="DG_output_voltage_in_Volts__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 6. TRANSFORMER DETAILS -->
            <h2 class="section slds-m-top_large" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">
                Transformer Details</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered"
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; border: 1px solid #dde5ef;">
                <tbody>
                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Qty & rating of
                            each Transformer
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Qty_rating_of_each_Transformer__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Impedance of
                            existing Transformer
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Impedance_of_existing_Transformer__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Grid main
                            breaker Capacity
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Grid_main_Breaker_Capacity__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 7. LOAD DETAILS -->
            <h2 class="section slds-m-top_large" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Load
                details</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered"
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; border: 1px solid #dde5ef;">

                <tbody>
                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; vertical-align: top; white-space: normal; word-wrap: break-word;">
                            Min. Load during day Weekdays
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Min_Load_during_day_Weekdays__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td
                            style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; vertical-align: top; white-space: normal; word-wrap: break-word;">
                            Min. Load during day Holidays & Weekends
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Min_Load_during_day_Holidays_Weekends__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; vertical-align: top; white-space: normal; word-wrap: break-word;">
                            Max. Load During Day Weekdays
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Max_Load_During_Day_Weekdays__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td
                            style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; vertical-align: top; white-space: normal; word-wrap: break-word;">
                            Max. Load During
                            Day Holidays & Weekends
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Max_Load_During_Day_Holidays_Weekends__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 8. OTHER ELECTRICAL INFRASTRUCTURE -->
            <h2 class="section slds-m-top_large" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">
                Other Electrical Infrastructure (LT Panel, Protection & Termination point)</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered"
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; border: 1px solid #dde5ef;">
                <tbody>
                    <tr>
                        <td
                            style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; vertical-align: top; white-space: normal; word-wrap: break-word;">
                            Availability of Spare Feeder(s) in Existing LT Panel
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Availability_of_Spare_Feeder_s__c" variant="label-hidden"
                                onchange={handleFeederChange}>
                            </lightning-input-field>
                        </td>
                    </tr>

                    <template if:true={showRating}>
                        <tr>
                            <td
                                style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; vertical-align: top; white-space: normal; word-wrap: break-word;">
                                Rating of Spare Feeder(s)
                            </td>
                            <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                                <lightning-input-field field-name="Rating_of_Spare_Feeder_s__c" variant="label-hidden">
                                </lightning-input-field>
                            </td>
                        </tr>
                    </template>
                    <template if:true={showBusbarSection}>
                        <tr>
                            <td
                                style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; vertical-align: top; white-space: normal; word-wrap: break-word;">
                                Existing LT Panel Bus Bar (Possibility of termination) & Bus Bar Material
                            </td>
                            <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                                <lightning-input-field field-name="Existing_LT_Panel_Bus_Bar__c" variant="label-hidden">
                                </lightning-input-field>
                            </td>
                            <td
                                style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef; vertical-align: top; white-space: normal; word-wrap: break-word;">
                                Is the Cubical Space available for additional LT Panel
                            </td>
                            <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                                <lightning-input-field field-name="Cubical_Space_available_LT_Panel__c"
                                    variant="label-hidden">
                                </lightning-input-field>
                            </td>
                        </tr>
                    </template>
                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Lightning
                            Arrester available at Site
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Lightning_Arrester_available_at_Site__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 9. BUILDING DETAILS -->
            <h2 class="section slds-m-top_large" style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">
                Building details</h2>

            <table class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered"
                style="width:100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 2rem; border: 1px solid #dde5ef;">

                <tbody>
                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Age of
                            Building
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Age_of_Building_In_Years__c" variant="label-hidden">
                            </lightning-input-field>
                        </td>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Height of the
                            Building & No. of floors
                        </td>
                        <td style="padding: 0.75rem 1rem; border: 1px solid #dde5ef;">
                            <lightning-input-field field-name="Height_of_the_Building_No_of_floors__c"
                                variant="label-hidden">
                            </lightning-input-field>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 0.75rem 1rem; font-weight: 500; border: 1px solid #dde5ef;">Appearance of
                            Roof
                        </td>
